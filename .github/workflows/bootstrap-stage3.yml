name: Bootstrap Stage 3

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-stage3.yml'
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild Stage 3 project tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.txt | base64 -d > /tmp/shadowwarrior-stage3.zip
          unzip -o /tmp/shadowwarrior-stage3.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-stage3.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Shadow Warrior Windows 11 Stage 3 port kit"
          git push origin HEAD:main
